<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cards Delivery - October 1</title>
  <link rel="icon" type="image/png" href="./favicon.png">
<style>table td,table th{text-align:center!important;vertical-align:middle}table td>.flex{justify-content:center}</style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    (function () {
      var auth = sessionStorage.getItem('wd_october1_auth') || localStorage.getItem('wd_october1_auth');
      if (auth !== 'true') {
        location.replace('./index.html');
      }
      // Sync role to session
      try{
        var roleLocal = localStorage.getItem('wd_role');
        var roleSess = sessionStorage.getItem('wd_role');
        if(roleLocal && !roleSess){
          sessionStorage.setItem('wd_role', roleLocal);
          sessionStorage.setItem('wd_username', localStorage.getItem('wd_username') || '');
        }
      }catch(e){}
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
  <script src="./texts.js"></script>
  <script src="./sync.js"></script>
  <script src="./lookup.js"></script>
  <script src="./role-guard.js"></script>
  <script src="./admin.js" defer></script>
  <script src="./logout.js" defer></script>
  <script src="./status-patch.js" defer></script>
  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
</body>
</html>
